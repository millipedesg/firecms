name: Publish @millipedesg/firecms
on:
  push:
    branches: [v2-millipede]

permissions:
  id-token: write
  contents: read
  packages: write

defaults:
  run:
    working-directory: ./lib

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - run: yarn install --no-immutable
      - run: yarn build

      - name: Set CI version
        run: node -e "const fs=require('fs');const pkg=require('./package.json');const base=pkg.version.replace(/-milli\\.\\d+$/, '');const run=process.env.GITHUB_RUN_NUMBER || '0';pkg.version=base + '-milli.' + run;fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Pack release tarball
        run: npm pack

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate (dev AR)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/837633946356/locations/global/workloadIdentityPools/milli-pool/providers/github'
          service_account: 'gh-npm-publisher@millipede-dev.iam.gserviceaccount.com'

      - name: Publish tarball to dev AR
        run: |
          set -euo pipefail
          chmod +x ../scripts/write-millipedesg-npmrc.sh
          NPMRC_PATH=../.npmrc ../scripts/write-millipedesg-npmrc.sh millipede-dev
          npx -y google-artifactregistry-auth@3.5.0 --repo-config=../.npmrc --credential-config="$HOME/.npmrc"
          npm publish "$(ls -1t millipedesg-firecms-*.tgz | head -1)"

      - name: Authenticate (staging AR)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/362983291711/locations/global/workloadIdentityPools/milli-pool/providers/github-actions-provider'
          service_account: 'gh-npm-publisher@millipede-staging.iam.gserviceaccount.com'

      - name: Publish tarball to staging AR
        run: |
          set -euo pipefail
          NPMRC_PATH=../.npmrc ../scripts/write-millipedesg-npmrc.sh millipede-staging
          npx -y google-artifactregistry-auth@3.5.0 --repo-config=../.npmrc --credential-config="$HOME/.npmrc"
          npm publish "$(ls -1t millipedesg-firecms-*.tgz | head -1)"

      - name: Authenticate (prod AR)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/262802147889/locations/global/workloadIdentityPools/milli-pool/providers/github-actions-provider'
          service_account: 'gh-npm-publisher@millipede-prod.iam.gserviceaccount.com'

      - name: Publish tarball to prod AR
        run: |
          set -euo pipefail
          NPMRC_PATH=../.npmrc ../scripts/write-millipedesg-npmrc.sh millipede-prod
          npx -y google-artifactregistry-auth@3.5.0 --repo-config=../.npmrc --credential-config="$HOME/.npmrc"
          npm publish "$(ls -1t millipedesg-firecms-*.tgz | head -1)"

      - name: Dual-publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARBALL="$(ls -1t millipedesg-firecms-*.tgz | head -1)"
          {
            echo "@millipedesg:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc.gh
          npm publish "$TARBALL" --userconfig .npmrc.gh --registry=https://npm.pkg.github.com
          rm -f .npmrc.gh
